name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Pack
        id: pack
        run: |
          package_file="$(npm pack --silent)"
          cp "${package_file}" sesh-latest.tgz
          echo "package_file=${package_file}" >> "$GITHUB_OUTPUT"
          echo "latest_file=sesh-latest.tgz" >> "$GITHUB_OUTPUT"
          echo "Created ${package_file}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          target_commitish: main
          files: |
            ${{ steps.pack.outputs.package_file }}
            ${{ steps.pack.outputs.latest_file }}
          generate_release_notes: true
